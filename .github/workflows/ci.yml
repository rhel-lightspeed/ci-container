name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sanity:
    name: Sanity
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install Python
      uses: actions/setup-python@v6.1.0
      with:
        python-version: '3.12'

    - name: Run pre-commit checks
      uses: pre-commit/action@v3.0.1
